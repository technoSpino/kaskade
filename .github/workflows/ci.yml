name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  server:
    name: API tests & content validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      # spaCy + the German model: transcripts.recase (#34) needs them in the tests.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt spacy==3.8.16 \
            "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl"
      - name: Unit + API tests
        run: pytest -q -k "not content"
      - name: Content validation (data/)
        run: pytest -q -k content

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      # Both Playwright configs start the API from server/.venv (throwaway data dirs).
      - name: API virtualenv
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt spacy==3.8.16 \
            "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl"
      # ffmpeg: E2E fixtures (WebM clips) and the API's audio snippets.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Legacy A2 pages (Playwright)
        run: npm run test:e2e
        env:
          CI: true
      - name: Build for the Kaskade E2E
        if: success() || failure()
        run: npm run build
      - name: Kaskade (Playwright)
        if: success() || failure()
        run: npm run test:e2e:kaskade
        env:
          CI: true
      - name: Upload Playwright reports and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
